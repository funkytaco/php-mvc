<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <!--
    SOE / Host Build Order & Tracking Gateway — network architecture.
    Hand-authored. Names and ports derive from the app name at nimbus:create
    time; the values shown are the soe-demo instance (ports 8822/9954/5772).
  -->
  <defs>
    <marker id="mNavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#1f4e79"/>
    </marker>
    <marker id="mGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#806000"/>
    </marker>
    <marker id="mSlate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#44546a"/>
    </marker>
    <marker id="mBrick" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#843c39"/>
    </marker>
    <marker id="mGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#808080"/>
    </marker>
    <marker id="mInk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#1f2937"/>
    </marker>
  </defs>

  <!-- ======================= canvas ======================= -->
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>

  <text x="40" y="42" font-size="20" font-weight="bold" fill="#1f3a5f">SOE — Order &amp; Tracking Gateway · Network Architecture</text>
  <text x="40" y="63" font-size="11.5" fill="#6b7280">Nimbus-generated podman stack · instance: soe-demo · container names and published ports derive from the app name</text>
  <line x1="40" y1="76" x2="1360" y2="76" stroke="#d1d5db" stroke-width="1"/>

  <!-- ======================= browser (outside the pod network) ======================= -->
  <g>
    <rect x="40" y="110" width="240" height="170" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <rect x="40" y="110" width="240" height="26" rx="3" fill="#404040"/>
    <rect x="40" y="123" width="240" height="13" fill="#404040"/>
    <text x="52" y="127.5" font-size="12.5" font-weight="bold" fill="#ffffff">Browser</text>
    <text x="52" y="158" font-size="11.5" fill="#374151">MVC pages — no SPA, no Helix</text>
    <text x="52" y="175" font-size="11.5" fill="#374151">knowledge, no secrets</text>
    <text x="52" y="199" font-size="11.5" fill="#6b7280">Personas: owner · requester ·</text>
    <text x="52" y="215" font-size="11.5" fill="#6b7280">customer · teamlead · teammember</text>
    <text x="52" y="240" font-size="10.5" fill="#9ca3af">Roles arrive via Keycloak session;</text>
    <text x="52" y="256" font-size="10.5" fill="#9ca3af">admin = operator superuser</text>
  </g>

  <!-- ======================= logic gates panel ======================= -->
  <g>
    <rect x="40" y="310" width="240" height="470" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="52" y="336" font-size="13" font-weight="bold" fill="#1f3a5f">Conditional flow — logic gates</text>

    <!-- OR gate: /tracker persona guard -->
    <text x="150" y="368" font-size="11" font-weight="bold" fill="#1f3a5f">OR</text>
    <text x="138" y="384" font-size="10.5" fill="#374151" text-anchor="end">app-owner</text>
    <text x="138" y="398" font-size="10.5" fill="#374151" text-anchor="end">requester</text>
    <text x="138" y="412" font-size="10.5" fill="#374151" text-anchor="end">customer</text>
    <text x="138" y="426" font-size="10.5" fill="#374151" text-anchor="end">team-member</text>
    <text x="138" y="440" font-size="10.5" fill="#374151" text-anchor="end">admin</text>
    <line x1="142" y1="380" x2="172" y2="380" stroke="#1f2937" stroke-width="1.2"/>
    <line x1="142" y1="394" x2="176" y2="394" stroke="#1f2937" stroke-width="1.2"/>
    <line x1="142" y1="408" x2="178" y2="408" stroke="#1f2937" stroke-width="1.2"/>
    <line x1="142" y1="422" x2="176" y2="422" stroke="#1f2937" stroke-width="1.2"/>
    <line x1="142" y1="436" x2="172" y2="436" stroke="#1f2937" stroke-width="1.2"/>
    <!-- OR body: distinctive shape, pointing right -->
    <path d="M165 374 Q 212 374 244 402 Q 212 430 165 430 Q 182 402 165 374 Z"
          fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/>
    <line x1="244" y1="402" x2="262" y2="402" stroke="#1f2937" stroke-width="1.4" marker-end="url(#mInk)"/>
    <text x="205" y="452" font-size="10.5" fill="#374151" text-anchor="middle">/tracker access</text>
    <text x="52" y="476" font-size="10.5" fill="#6b7280">Persona::canAny() — ANY persona role</text>
    <text x="52" y="491" font-size="10.5" fill="#6b7280">(or admin) opens the read-only Order</text>
    <text x="52" y="506" font-size="10.5" fill="#6b7280">Tracker. Every other surface stays a</text>
    <text x="52" y="521" font-size="10.5" fill="#6b7280">single-role gate (can()).</text>

    <!-- AND gate: EDA callback auth -->
    <text x="150" y="560" font-size="11" font-weight="bold" fill="#1f3a5f">AND</text>
    <text x="158" y="582" font-size="10.5" fill="#374151" text-anchor="end">hash_equals(token)</text>
    <text x="158" y="614" font-size="10.5" fill="#374151" text-anchor="end">run still pending</text>
    <line x1="162" y1="578" x2="180" y2="578" stroke="#1f2937" stroke-width="1.2"/>
    <line x1="162" y1="610" x2="180" y2="610" stroke="#1f2937" stroke-width="1.2"/>
    <!-- AND body: flat back, semicircular front -->
    <path d="M180 566 H 216 A 28 28 0 0 1 216 622 H 180 Z"
          fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/>
    <line x1="244" y1="594" x2="262" y2="594" stroke="#1f2937" stroke-width="1.4" marker-end="url(#mInk)"/>
    <text x="180" y="644" font-size="10.5" fill="#374151">mark run complete</text>
    <text x="52" y="668" font-size="10.5" fill="#6b7280">The EDA playbook callback (flow 6) is</text>
    <text x="52" y="683" font-size="10.5" fill="#6b7280">accepted only with the single-use</text>
    <text x="52" y="698" font-size="10.5" fill="#6b7280">per-run token minted by</text>
    <text x="52" y="713" font-size="10.5" fill="#6b7280">SopRunnerService. Wrong token and</text>
    <text x="52" y="728" font-size="10.5" fill="#6b7280">unknown run answer identically (401):</text>
    <text x="52" y="743" font-size="10.5" fill="#6b7280">run ids cannot be enumerated and no</text>
    <text x="52" y="758" font-size="10.5" fill="#6b7280">data is ever returned.</text>
  </g>

  <!-- ======================= ghost: real Helix (not deployed) ======================= -->
  <g>
    <rect x="40" y="810" width="240" height="90" rx="3" fill="#ffffff" stroke="#9ca3af" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="52" y="834" font-size="12" font-weight="bold" fill="#6b7280">BMC Helix (production)</text>
    <text x="52" y="854" font-size="10.5" fill="#9ca3af">HelixHttpClient · HELIX_DRIVER=http</text>
    <text x="52" y="870" font-size="10.5" fill="#9ca3af">config switch, not a code change —</text>
    <text x="52" y="886" font-size="10.5" fill="#9ca3af">NOT present in this stack</text>
  </g>
  <path d="M430 300 L310 300 L310 845 L282 845" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#mGray)"/>

  <!-- ======================= podman network boundary ======================= -->
  <rect x="340" y="110" width="1030" height="740" rx="4" fill="#f8fafc" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="7 5"/>
  <text x="1356" y="132" font-size="11.5" fill="#6b7280" text-anchor="end">host · podman-compose “soe-demo” · network: soe-demo-net (bridge)</text>

  <!-- ======================= soe-demo-app ======================= -->
  <g>
    <rect x="430" y="180" width="350" height="240" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <rect x="430" y="180" width="350" height="26" rx="3" fill="#1f4e79"/>
    <rect x="430" y="193" width="350" height="13" fill="#1f4e79"/>
    <text x="442" y="197.5" font-size="12.5" font-weight="bold" fill="#ffffff">soe-demo-app — PHP 8.2 / Apache :8080</text>
    <text x="445" y="230" font-size="12" fill="#374151">Surfaces: /catalog /order /tracker /sops</text>
    <text x="445" y="252" font-size="12" fill="#374151">JSON API: /api/* · persona-guarded</text>
    <rect x="700" y="240" width="30" height="16" rx="2" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
    <text x="715" y="251.5" font-size="10" font-weight="bold" fill="#1f2937" text-anchor="middle">OR</text>
    <line x1="445" y1="264" x2="765" y2="264" stroke="#e5e7eb" stroke-width="1"/>
    <text x="445" y="284" font-size="12" fill="#374151">OrderIntakeService — the ONE Helix write</text>
    <text x="445" y="306" font-size="12" fill="#374151">HelixClient port &#8594; MockHelixClient</text>
    <text x="445" y="322" font-size="10.5" fill="#6b7280">(HELIX_DRIVER=mock · advance() is demo-env only)</text>
    <text x="445" y="344" font-size="12" fill="#374151">SopRunnerService — mints run token, fires EDA</text>
    <text x="445" y="366" font-size="12" fill="#374151">AuthController — OIDC code flow vs Keycloak</text>
    <text x="445" y="392" font-size="10.5" fill="#6b7280">Every app-side write appends an immutable audit_log row</text>
  </g>

  <!-- ======================= soe-demo-postgres (app store) ======================= -->
  <g>
    <rect x="430" y="560" width="330" height="140" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <rect x="430" y="560" width="330" height="26" rx="3" fill="#44546a"/>
    <rect x="430" y="573" width="330" height="13" fill="#44546a"/>
    <text x="442" y="577.5" font-size="12.5" font-weight="bold" fill="#ffffff">soe-demo-postgres — postgres:14</text>
    <text x="445" y="608" font-size="11.5" fill="#374151">App store: orders · catalog_items · skus ·</text>
    <text x="445" y="625" font-size="11.5" fill="#374151">sop_notes · sop_runs · audit_log</text>
    <text x="445" y="649" font-size="11.5" font-weight="bold" fill="#806000">mock_helix_tickets — the Helix ticket store</text>
    <text x="445" y="666" font-size="10.5" fill="#6b7280">(mock stand-in: Helix owns fulfillment state)</text>
    <text x="445" y="686" font-size="10.5" fill="#6b7280">schema.sql seeds at first boot · internal :5432 only</text>
  </g>

  <!-- ======================= soe-demo-keycloak ======================= -->
  <g>
    <rect x="870" y="180" width="290" height="150" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <rect x="870" y="180" width="290" height="26" rx="3" fill="#806000"/>
    <rect x="870" y="193" width="290" height="13" fill="#806000"/>
    <text x="882" y="197.5" font-size="12.5" font-weight="bold" fill="#ffffff">soe-demo-keycloak — start-dev</text>
    <text x="885" y="228" font-size="11.5" fill="#374151">Realm: soe-demo-realm</text>
    <text x="885" y="246" font-size="11.5" fill="#374151">Client: soe-demo-client (confidential)</text>
    <text x="885" y="270" font-size="11.5" fill="#6b7280">Roles: app-owner · requester · customer</text>
    <text x="885" y="287" font-size="11.5" fill="#6b7280">· team-member · admin</text>
    <text x="885" y="311" font-size="10.5" fill="#9ca3af">Container :8080 · published on host :9954</text>
  </g>

  <!-- ======================= soe-demo-keycloak-db ======================= -->
  <g>
    <rect x="1195" y="180" width="160" height="150" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <rect x="1195" y="180" width="160" height="26" rx="3" fill="#44546a"/>
    <rect x="1195" y="193" width="160" height="13" fill="#44546a"/>
    <text x="1207" y="197.5" font-size="12" font-weight="bold" fill="#ffffff">…-keycloak-db</text>
    <text x="1207" y="228" font-size="11.5" fill="#374151">postgres:14</text>
    <text x="1207" y="246" font-size="11.5" fill="#374151">keycloak_db</text>
    <text x="1207" y="270" font-size="10.5" fill="#6b7280">internal :5432</text>
    <text x="1207" y="287" font-size="10.5" fill="#6b7280">data/ bind mount</text>
    <text x="1207" y="311" font-size="10.5" fill="#9ca3af">(realm survives)</text>
  </g>

  <!-- ======================= soe-demo-keycloak-setup (one-shot sidecar) ======================= -->
  <g>
    <rect x="870" y="400" width="290" height="130" rx="3" fill="#ffffff" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
    <rect x="870" y="400" width="290" height="26" rx="3" fill="#808080"/>
    <rect x="870" y="413" width="290" height="13" fill="#808080"/>
    <text x="882" y="417.5" font-size="12.5" font-weight="bold" fill="#ffffff">soe-demo-keycloak-setup — alpine</text>
    <text x="885" y="448" font-size="11.5" fill="#374151">curl + jq · runs keycloak-init.sh once</text>
    <text x="885" y="466" font-size="11.5" fill="#374151">Creates realm · client · 5 roles · 5 users</text>
    <text x="885" y="490" font-size="10.5" fill="#6b7280">restart: never — exits when done</text>
    <text x="885" y="507" font-size="10.5" fill="#6b7280">(a “5/6 running” stack is the healthy state)</text>
  </g>

  <!-- ======================= soe-demo-eda ======================= -->
  <g>
    <rect x="850" y="620" width="360" height="170" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <rect x="850" y="620" width="360" height="26" rx="3" fill="#843c39"/>
    <rect x="850" y="633" width="360" height="13" fill="#843c39"/>
    <text x="862" y="637.5" font-size="12.5" font-weight="bold" fill="#ffffff">soe-demo-eda — ansible-rulebook</text>
    <text x="865" y="668" font-size="11.5" fill="#374151">Webhook source :5000 (host :5772, debug only)</text>
    <text x="865" y="690" font-size="11.5" fill="#374151">sop-rules.yml: match sop_run &#8594; run_playbook</text>
    <text x="865" y="712" font-size="11.5" fill="#374151">sop-demo.yml: demo body — touches NO infra,</text>
    <text x="865" y="729" font-size="11.5" fill="#374151">then POSTs the signed callback (flow 6)</text>
    <text x="865" y="753" font-size="10.5" fill="#6b7280">init-entrypoint.sh guards every rulebook launch</text>
    <text x="865" y="770" font-size="10.5" fill="#6b7280">Bind mounts: rulebooks · playbooks · inventory · logs</text>
  </g>

  <!-- ======================= traffic flows (orthogonal) ======================= -->
  <!-- 1: browser <-> keycloak, OIDC redirects -->
  <path d="M160 110 L160 90 L1015 90 L1015 178" fill="none" stroke="#806000" stroke-width="1.4" marker-end="url(#mGold)" marker-start="url(#mGold)"/>
  <text x="1025" y="105" font-size="10" fill="#6b7280">9954 &#8594; :8080</text>
  <!-- 2: app -> keycloak, backchannel token exchange -->
  <line x1="780" y1="255" x2="868" y2="255" stroke="#806000" stroke-width="1.4" marker-end="url(#mGold)"/>
  <!-- 3: browser -> app, pages + API -->
  <line x1="280" y1="235" x2="428" y2="235" stroke="#1f4e79" stroke-width="1.4" marker-end="url(#mNavy)"/>
  <text x="300" y="252" font-size="10" fill="#6b7280">8822 &#8594; :8080</text>
  <!-- 4: app -> postgres, PDO -->
  <line x1="570" y1="420" x2="570" y2="558" stroke="#44546a" stroke-width="1.4" marker-end="url(#mSlate)"/>
  <!-- 5: app -> eda, sop_run event -->
  <path d="M780 340 L820 340 L820 690 L848 690" fill="none" stroke="#843c39" stroke-width="1.4" marker-end="url(#mBrick)"/>
  <!-- 6: eda -> app, signed callback -->
  <path d="M850 730 L795 730 L795 380 L782 380" fill="none" stroke="#843c39" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#mBrick)"/>
  <!-- 7: setup -> keycloak, one-shot admin REST -->
  <line x1="1015" y1="398" x2="1015" y2="332" stroke="#808080" stroke-width="1.4" marker-end="url(#mGray)"/>
  <!-- 8: keycloak -> keycloak-db, JDBC -->
  <line x1="1160" y1="255" x2="1193" y2="255" stroke="#44546a" stroke-width="1.4" marker-end="url(#mSlate)"/>

  <!-- flow number badges -->
  <g font-size="11" font-weight="bold" text-anchor="middle">
    <circle cx="600" cy="90" r="10" fill="#ffffff" stroke="#806000" stroke-width="1.4"/>
    <text x="600" y="94" fill="#806000">1</text>
    <circle cx="824" cy="255" r="10" fill="#ffffff" stroke="#806000" stroke-width="1.4"/>
    <text x="824" y="259" fill="#806000">2</text>
    <circle cx="352" cy="235" r="10" fill="#ffffff" stroke="#1f4e79" stroke-width="1.4"/>
    <text x="352" y="239" fill="#1f4e79">3</text>
    <circle cx="570" cy="490" r="10" fill="#ffffff" stroke="#44546a" stroke-width="1.4"/>
    <text x="570" y="494" fill="#44546a">4</text>
    <circle cx="820" cy="500" r="10" fill="#ffffff" stroke="#843c39" stroke-width="1.4"/>
    <text x="820" y="504" fill="#843c39">5</text>
    <circle cx="795" cy="560" r="10" fill="#ffffff" stroke="#843c39" stroke-width="1.4"/>
    <text x="795" y="564" fill="#843c39">6</text>
    <circle cx="1015" cy="365" r="10" fill="#ffffff" stroke="#808080" stroke-width="1.4"/>
    <text x="1015" y="369" fill="#808080">7</text>
    <circle cx="1176" cy="240" r="10" fill="#ffffff" stroke="#44546a" stroke-width="1.4"/>
    <text x="1176" y="244" fill="#44546a">8</text>
  </g>

  <!-- AND marker on the callback flow -->
  <text x="778" y="588" font-size="10" font-weight="bold" fill="#1f2937" text-anchor="middle">AND</text>

  <!-- ======================= flow legend ======================= -->
  <g font-size="11.5" fill="#374151">
    <text x="340" y="884"><tspan fill="#806000" font-weight="bold">1</tspan> OIDC login/logout redirects (browser &#8596; Keycloak, host :9954)   <tspan fill="#806000" font-weight="bold">2</tspan> backchannel code&#8594;token exchange (app &#8594; soe-demo-keycloak:8080)</text>
    <text x="340" y="906"><tspan fill="#1f4e79" font-weight="bold">3</tspan> HTML surfaces + JSON API (host :8822; the tracker polls /api/orders/{ref} every 15 s) — /tracker admits any persona <tspan fill="#1f2937" font-weight="bold">[OR]</tspan></text>
    <text x="340" y="928"><tspan fill="#44546a" font-weight="bold">4</tspan> PDO :5432 — app store + mock Helix tickets (one write: createTicket)   <tspan fill="#843c39" font-weight="bold">5</tspan> sop_run event &#8594; POST soe-demo-eda:5000/endpoint (+ callback_url, token)</text>
    <text x="340" y="950"><tspan fill="#843c39" font-weight="bold">6</tspan> playbook callback &#8594; POST /api/sops/runs/{id}/complete — single-use token <tspan fill="#1f2937" font-weight="bold">[AND]</tspan>   <tspan fill="#808080" font-weight="bold">7</tspan> one-shot admin REST realm setup   <tspan fill="#44546a" font-weight="bold">8</tspan> Keycloak JDBC :5432</text>
    <text x="340" y="976" font-size="10.5" fill="#9ca3af">Container DNS names resolve only on soe-demo-net; the host reaches the stack solely through the published ports 8822 / 9954 / 5772.</text>
  </g>
  <text x="1360" y="976" font-size="10.5" fill="#9ca3af" text-anchor="end">Rev B · 2026-08-05</text>
</svg>
